        ? `<div class="friend-line">${avatar(S.me.name, '', 'lg', S.me.avatar)}<div class="grow"><b>${esc(S.me.name)}</b><div class="muted" style="font-size:13px">${isCloud() ? (S.me.email ? esc(S.me.email) : 'Conta do claude.ai') : 'Modo local (só neste navegador)'}</div></div><a class="btn sm" href="#/profile">Editar perfil</a>${S.me.email && window.LIFE_SOCIAL.signOut ? '<button class="btn ghost sm" data-action="logout">Sair</button>' : ''}</div>`
        : `<form id="profile-form" style="max-width:none">
        <label class="f">Nome de exibição<input type="text" name="name" maxlength="24" value="${esc(S.profile.name)}" required></label>
        <div><button class="btn" type="submit">Salvar</button></div>
      </form>`}
    </div>
    <div class="panel reveal" style="--i:2;margin-top:18px;max-width:620px">
      <h3>Aparência</h3>
      <label class="switch"><span><b>Reduzir animações</b><div class="muted" style="font-size:13px">Desliga movimentos e transições da interface.</div></span>
        <input type="checkbox" id="reduce" ${S.profile.reduceMotion ? 'checked' : ''}><span class="track"></span></label>
    </div>
    ${demo}
    <div class="panel reveal" style="--i:4;margin-top:18px;max-width:620px">
      <h3>Sobre</h3>
      <p class="muted">Life · protótipo v0.2. Os jogos, amigos e posts são fictícios, o pagamento é simulado e nenhum arquivo de jogo é baixado de verdade.</p>
    </div>`;
  if (!setView(rid, html)) return;
  const pf = document.getElementById('profile-form');
  if (pf) pf.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name = new FormData(ev.target).get('name');
    try {
      S.profile = await api('/api/profile', { method: 'PUT', body: { name } });
      applyProfile();
      toast('Perfil salvo.');
    } catch (err) { toast(err.message); }
  });
  document.getElementById('reduce').addEventListener('change', async (ev) => {
    try {
      S.profile = await api('/api/profile', { method: 'PUT', body: { reduceMotion: ev.target.checked } });
      applyProfile();
    } catch (err) { toast(err.message); }
  });
}

/* ============================== downloads ============================== */
function renderMini() {
  const el = document.getElementById('mini-dl');
  if (!el) return;
  if (!downloads.size) { el.classList.remove('on'); el.innerHTML = ''; return; }
  const [id, d] = downloads.entries().next().value;
  el.classList.add('on');
  el.innerHTML = `<a href="#/downloads" class="mini-card"><span class="mini-t">${icon('download', 16)} ${esc(d.title)}</span><span class="bar"><i data-dl-bar="${esc(id)}" style="width:${d.pct}%"></i></span><span class="mini-s" data-dl-pct="${esc(id)}">${Math.round(d.pct)}%</span></a>`;
}

function paintDownloads() {
  downloads.forEach((d, id) => {
    document.querySelectorAll(`[data-dl-bar="${id}"]`).forEach((b) => { b.style.width = d.pct + '%'; });
    document.querySelectorAll(`[data-dl-pct="${id}"]`).forEach((b) => { b.textContent = Math.round(d.pct) + '%'; });
    document.querySelectorAll(`[data-dl-info="${id}"]`).forEach((b) => { b.textContent = dlInfo(d); });
  });
}

function startDownload(id) {
  if (downloads.has(id)) return;
  const g = gamesById.get(id);
  const size = g ? g.sizeGB : 5;
  const dur = Math.min(12, Math.max(4, 3 + size / 6)); // segundos
  const d = { pct: 0, title: g ? g.title : id, size, speed: 40 + Math.random() * 50, dur };
  downloads.set(id, d);
  renderMini();
  refreshView();
  const timer = setInterval(async () => {
    d.pct = Math.min(100, d.pct + (100 / (dur * 4)) * (0.8 + Math.random() * 0.4));
    d.speed = Math.max(20, d.speed + (Math.random() - 0.5) * 8);
    paintDownloads();
    if (d.pct < 100) return;
    clearInterval(timer);
    try { await api('/api/library/' + enc(id) + '/install', { method: 'POST' }); }
    catch (err) { toast(err.message); }
    downloads.delete(id);
    S.history.unshift({ title: d.title, size: String(d.size), at: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) });
    notify(`${d.title} foi instalado.`);
    toast(`${d.title} instalado.`);
    renderMini();
    refreshView();
  }, 250);
}

/* =============================== roteador =============================== */
const ROUTES = {
  '': homeView, store: storeView, library: libraryView, friends: friendsView, community: communityView,
  downloads: downloadsView, cart: cartView, publish: () => publishView(), settings: settingsView, game: gameView, profile: profileView,
};

async function render({ animate = true } = {}) {
  const parts = location.hash.replace(/^#/, '').split('/'); // "/game/abc" -> ["", "game", "abc"]
  const name = parts[1] || '';
  const arg = parts[2] ? decodeURIComponent(parts[2]) : '';
  current = { name, arg };
  renderId++;
  clearTimers();
  heroCtl = null;
  updateNav(name);
  updateBadge();
  $view.classList.toggle('view-enter', animate);
  try {
    await (ROUTES[name] || homeView)(arg);
    if (animate) $content.scrollTo({ top: 0, behavior: 'auto' });
  } catch (err) {
    $view.innerHTML = `<div class="empty error">${esc(err.message)}</div>`;
  }
}

// Atualiza a tela atual sem repetir a animação de entrada
function refreshView() {
  if (['library', 'downloads', 'game', 'cart'].includes(current.name)) return render({ animate: false });
}

window.addEventListener('hashchange', () => render());

/* ================================ ações ================================ */
function pop(el) {
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

document.addEventListener('click', async (ev) => {
  // fecha o menu de notificações ao clicar fora
  const notesEl = document.getElementById('notes');
  if (!notesEl.hidden && !ev.target.closest('.notes-wrap')) notesEl.hidden = true;

  if (ev.target.closest('#bell')) {
    notesEl.hidden = !notesEl.hidden;
    if (!notesEl.hidden) {
      paintNotes();
      S.unread = 0;
      document.getElementById('bell-dot').hidden = true;
    }
    return;
  }

  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  try {
    switch (el.dataset.action) {
      case 'open': location.hash = '#/game/' + enc(id); break;
      case 'back': ev.preventDefault(); if (history.length > 1) history.back(); else location.hash = '#/'; break;
      case 'genre': S.genre = el.dataset.genre; await loadGrid(); break;
      case 'hero': if (heroCtl) heroCtl.go(el.dataset.to); break;
      case 'lib-tab':
        S.libTab = el.dataset.tab;
        document.querySelectorAll('.tabs .tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === S.libTab));
        placeTabIndicator();
        paintLibrary(libItems);
        break;
      case 'req-tab':
        document.querySelectorAll('[data-action="req-tab"]').forEach((t) => t.classList.toggle('on', t === el));
        document.querySelectorAll('.req-panel').forEach((p) => p.classList.toggle('on', p.dataset.req === el.dataset.tab));
        break;
      case 'add-cart':
        if (!S.cart.includes(id)) S.cart.push(id);
        saveCart();
        toast('Adicionado ao carrinho.');
        await render({ animate: false });
        break;
      case 'buy-now':
        if (!S.cart.includes(id)) S.cart.push(id);
        saveCart();
        location.hash = '#/cart';
        break;
      case 'remove-cart':
        S.cart = S.cart.filter((x) => x !== id);
        saveCart();
        await render({ animate: false });
        break;
      case 'buy': {
        const result = await api('/api/purchase', { method: 'POST', body: { ids: S.cart } });
        S.cart = [];
        saveCart();
        toast(`Compra simulada concluída (${brl(result.total)}).`);
        notify(`Compra de ${result.purchased.length} jogo(s) concluída.`);
        location.hash = '#/library';
        break;
      }
      case 'install': startDownload(id); break;
      case 'uninstall':
        await api('/api/library/' + enc(id) + '/install', { method: 'DELETE' });
        toast('Jogo desinstalado.');
        await render({ animate: false });
        break;
      case 'play': {
        const r = await api('/api/library/' + enc(id) + '/play', { method: 'POST' });
        toast(`Sessão simulada: +${r.minutes} min de jogo.`);
        if (r.newAchievements > 0) {
          const g = gamesById.get(id);
          notify(`Nova conquista em ${g ? g.title : 'um jogo'}! 🏆`);
          toast(`Nova conquista desbloqueada! 🏆 (+${r.newAchievements})`);
        }
        await render({ animate: false });
        break;
      }
      case 'fav': {
        const on = !S.favorites.has(id);
        await api('/api/favorites/' + enc(id), { method: on ? 'POST' : 'DELETE' });
        if (on) S.favorites.add(id); else S.favorites.delete(id);
        document.querySelectorAll(`[data-action="fav"][data-id="${id}"]`).forEach((b) => { b.classList.toggle('on', on); pop(b); });
        toast(on ? 'Adicionado aos favoritos.' : 'Removido dos favoritos.');
        if (current.name === 'library' && S.libTab === 'favorites') await render({ animate: false });
        break;
      }
      case 'like': {
        const base = Number(el.dataset.base);
        const on = !S.liked.has(id);
        if (on) S.liked.add(id); else S.liked.delete(id);
        el.classList.toggle('on', on);
        el.querySelector('span').textContent = base + (on ? 1 : 0);
        pop(el);
        break;
      }
      case 'logout': await window.LIFE_SOCIAL.signOut(); location.reload(); break;
      case 'friend-tab': S.friendTab = el.dataset.tab; await render({ animate: false }); break;
      case 'req-send': await api('/api/requests', { method: 'POST', body: { to: id } }); toast('Pedido enviado.'); await render({ animate: false }); break;
      case 'req-accept': await api('/api/requests/' + enc(id) + '/accept', { method: 'POST' }); toast('Pedido aceito. Vocês agora são amigos.'); await render({ animate: false }); break;
      case 'req-decline': await api('/api/requests/' + enc(id) + '/decline', { method: 'POST' }); toast('Pedido recusado.'); await render({ animate: false }); break;
      case 'req-cancel': await api('/api/requests/' + enc(id), { method: 'DELETE' }); toast('Pedido cancelado.'); await render({ animate: false }); break;
      case 'unfriend':
        if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Confirmar?'; setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Desfazer'; }, 3000); break; }
        await api('/api/friends/' + enc(id), { method: 'DELETE' }); toast('Amizade desfeita.'); await render({ animate: false });
        break;
      case 'demo-reset': {
        if (downloads.size) { toast('Espere os downloads terminarem para restaurar.'); break; }
        window.LIFE_DEMO.reset();
        S.cart = []; saveCart();
        S.favorites = new Set(); S.liked = new Set(); S.history = []; S.notes = []; S.unread = 0;
        document.getElementById('bell-dot').hidden = true;
        S.profile = await api('/api/profile');
        applyProfile();
        renderMini();
        toast('Dados de exemplo restaurados.');
        await render({ animate: false });
        break;
      }
    }
  } catch (err) {
    toast(err.message);
  }
});

// Efeito de ondas nos botões
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.btn');
  if (!b || b.disabled || S.profile.reduceMotion) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s);
  setTimeout(() => s.remove(), 700);
});

// Inclinação 3D suave nos cartões
$view.addEventListener('mousemove', (e) => {
  const c = e.target.closest('.card');
  if (!c || S.profile.reduceMotion) return;
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  c.style.setProperty('--ry', (x * 8).toFixed(2) + 'deg');
  c.style.setProperty('--rx', (-y * 8).toFixed(2) + 'deg');
});
$view.addEventListener('mouseout', (e) => {
  const c = e.target.closest('.card');
  if (c && !c.contains(e.relatedTarget)) {
    c.style.setProperty('--rx', '0deg');
    c.style.setProperty('--ry', '0deg');
  }
});

// Busca global na barra do topo
document.getElementById('gsearch').addEventListener('input', (e) => {
  S.q = e.target.value;
  if (current.name === 'store') loadGrid();
  else location.hash = '#/store';
});

window.addEventListener('resize', () => { updateNav(current.name); placeTabIndicator(); });

/* ================================ início ================================ */
function updateReqBadge(n) {
  const b = document.getElementById('fr-badge');
  if (!b) return;
  b.textContent = n; b.hidden = !n;
}

let socialTimer;
async function onSocial() {
  if (!SOCIAL || !S.me || !S.me.registered) return;
  let soc;
  try { soc = await api('/api/social'); } catch (e) { return; }
  const inc = new Set(soc.incoming.map((p) => p.id));
  const fresh = soc.incoming.filter((p) => !S.seenReq.has(p.id));
  fresh.forEach((p) => S.seenReq.add(p.id));
  if (fresh.length) {
    const t = fresh.length === 1 ? `${fresh[0].name} enviou um pedido de amizade.` : `${fresh.length} novos pedidos de amizade.`;
    notify(t); toast(t);
  }
  soc.friends.forEach((p) => { if (S.outIds.has(p.id)) { notify(`${p.name} aceitou seu pedido de amizade.`); S.outIds.delete(p.id); } });
  soc.outgoing.forEach((p) => S.outIds.add(p.id));
  [...S.seenReq].forEach((id) => { if (!inc.has(id)) S.seenReq.delete(id); });
  updateReqBadge(soc.incoming.length);
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#view') && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (S.socialInit && !typing && current.name === 'friends') render({ animate: false });
  S.socialInit = true;
}
window.addEventListener('life-social', () => { clearTimeout(socialTimer); socialTimer = setTimeout(onSocial, 300); });

(async function boot() {
  buildChrome();
  $view.innerHTML = '<div class="empty">Carregando...</div>';
  if (window.LIFE_DEMO && window.LIFE_DEMO.ready) { try { await window.LIFE_DEMO.ready; } catch (e) { /* segue */ } }
  if (SOCIAL) {
    try { S.me = await api('/api/me'); } catch (e) { S.me = { id: 'local', mode: 'local', registered: false, name: '', bio: '', avatar: '', banner: '' }; }
    if (isCloud() && window.LIFE_DEMO) S.cart = window.LIFE_DEMO.getCart();
    if (!S.me.registered) await showWelcome();
  }
  try { S.profile = await api('/api/profile'); } catch (e) { /* usa o padrão */ }
  try { S.favorites = new Set(await api('/api/favorites')); } catch (e) { /* usa o padrão */ }
  applyProfile();
  updateBadge();
  await render();
  onSocial();
})();
</script>
